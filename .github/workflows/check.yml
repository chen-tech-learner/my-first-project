name: 直播源自动检测清理
on:
  schedule:
    - cron: '0 12 1,8,15,22 * *'
  push:
    branches: [ main ]
    paths:
      - '5yuelb.m3u8'
      - '5yueyw.m3u8'
      - 'cdychj1.json'
      - 'cdys620.json'
      - 'lives.json'
      - 'check_lives.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ✔校验所有核心JSON语法
        run: |
          python -m json.tool lives.json
          python -m json.tool cdychj1.json
          python -m json.tool cdys620.json

      - name: 安装依赖
        run: pip install requests

      - name: 执行直播源检测脚本
        run: python check_lives.py

      - name: ✔校验生成后的live_ok.json
        run: python -m json.tool live_ok.json

      - name: 提交生成的live_ok文件
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add live_ok.json live_ok.m3u
          git commit -m "Auto update live_ok" || echo "无变更跳过提交"
          git push
