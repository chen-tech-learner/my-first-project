name: 直播源自动检测清理
on:
  # 定时：每月1/8/15/22号 UTC12点 = 北京时间20点
  schedule:
    - cron: '0 12 1,8,15,22 * *'
  # 保留手动提交触发（你改代码推送时依然能手动跑）
  push:
    branches: [ main ]
  # 额外支持手动点按钮随时跑
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install requests
      - name: 执行直播源检测脚本
        run: python check_lives.py
      - name: 提交生成的live_ok文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_ok.m3u live_ok.json
          git commit -m "🤖自动检测更新直播活源" || echo "无新存活源，无需提交"
          git push
